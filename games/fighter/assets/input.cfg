# fighter controls (cartwheel/input.h binding text). Three buttons: punch, kick, block. Up / down with a button picks the
# height (up high, down low, neutral mid), forward a stepping variant; punch + kick together throws.
# Pad: X punch, A kick, B block; Y and the left shoulder are punch + kick (a throw), the right shoulder is block.
# Player 1 also has the keyboard: W A S D, J punch, K kick, L block, I throw.
# Player 2: pad 2, or on a shared keyboard the arrow keys and comma punch, period kick, slash block, semicolon throw (k2_).
mv_left = axis:lx-@0.5, pad:left, key:a
mv_right = axis:lx+@0.5, pad:right, key:d
mv_up = axis:ly-@0.55, pad:up, key:w
mv_down = axis:ly+@0.55, pad:down, key:s
atk_p = pad:west, key:j
atk_k = pad:south, key:k
atk_g = pad:east, pad:rshoulder, key:l
atk_pk = pad:north, pad:lshoulder, key:i
k2_left = key:left
k2_right = key:right
k2_up = key:up
k2_down = key:down
k2_p = key:comma
k2_k = key:period
k2_g = key:slash
k2_pk = key:semicolon
tr_mode = pad:back, key:tab
tr_reset = pad:guide, key:r
tr_dummy = pad:lstick, key:f
tr_boxes = pad:rstick, key:b
