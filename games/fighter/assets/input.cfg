# fighter controls (cartwheel/input.h binding text). Player 1: pad 1 plus the keyboard (WASD and J K L I).
# Player 2: pad 2, or on a shared keyboard the arrow keys and , . / ; (the k2_ actions below).
mv_left = axis:lx-@0.5, pad:left, key:a
mv_right = axis:lx+@0.5, pad:right, key:d
mv_up = axis:ly-@0.55, pad:up, key:w
mv_down = axis:ly+@0.55, pad:down, key:s
atk_l = pad:west, key:j
atk_m = pad:north, key:k
atk_h = pad:east, key:l
atk_t = pad:south, pad:lshoulder, pad:rshoulder, key:i
k2_left = key:left
k2_right = key:right
k2_up = key:up
k2_down = key:down
k2_l = key:comma
k2_m = key:period
k2_h = key:slash
k2_t = key:semicolon
tr_mode = pad:back, key:tab
tr_reset = pad:guide, key:r
tr_dummy = pad:lstick, key:f
tr_boxes = pad:rstick, key:b
