# Player one may use the keyboard. Each pad owns one captain.
turn_left = key:a, key:left, pad:left, axis:lx-
turn_right = key:d, key:right, pad:right, axis:lx+
sail_up = key:w, key:up, pad:up, axis:ly-
sail_down = key:s, key:down, pad:down, axis:ly+
aim_left = key:j, axis:rx-, axis:lt+
aim_right = key:l, axis:rx+
fire = key:space, key:j, key:l, axis:lt+, axis:rt+, pad:rshoulder
dock = key:e, pad:south
upgrade_hull = key:1, pad:west
upgrade_sails = key:2, pad:north
upgrade_guns = key:3, pad:east
start = key:return, pad:start
mode_left = key:q, pad:lshoulder
mode_right = key:r, pad:rshoulder
map_next = key:t, pad:back
game_pause = key:escape, pad:start
leave_match = key:q, pad:back
