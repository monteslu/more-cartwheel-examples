# brawler controls (cartwheel/input.h binding text). The shell defines the menu actions.
left = key:left, key:a, pad:left, axis:lx-
right = key:right, key:d, pad:right, axis:lx+
up = key:up, key:w, pad:up, axis:ly-
down = key:down, key:s, pad:down, axis:ly+
attack = key:j, key:z, pad:west
kick = key:k, key:x, pad:north
jump = key:space, pad:south
grab = key:l, key:c, pad:rshoulder, axis:rt+
special = key:i, key:v, pad:lshoulder, axis:lt+
