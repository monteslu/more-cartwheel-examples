left = key:left, key:a, pad:left, axis:lx-, touch:0.left
right = key:right, key:d, pad:right, axis:lx+, touch:0.right
up = key:up, key:w, pad:up, axis:ly-, touch:0.up
down = key:down, key:s, pad:down, axis:ly+, touch:0.down
jump = key:space, key:z, pad:south, touch:1
run = key:lshift, key:x, pad:west, touch:2
dash = key:c, key:f, pad:rshoulder, touch:3
grab = key:v, key:e, pad:lshoulder, touch:4
map = key:m, key:tab, pad:back
retry = key:r, pad:north
