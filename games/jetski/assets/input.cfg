# jetski controls (cartwheel/input.h binding text). The shell defines the menu actions.
# The stick steers from a small dead zone, and the game squares what is past it (main.c), so a nudge stays small.
steer_left = deadzone:0.15, key:left, key:a, pad:left, axis:lx-
steer_right = deadzone:0.15, key:right, key:d, pad:right, axis:lx+
lean_back = key:down, key:s, pad:down, axis:ly+
lean_fwd = key:up, key:w, pad:up, axis:ly-
throttle = key:space, key:j, pad:south, axis:rt+
trick = key:k, pad:west
kick = key:i, pad:north
turbo = key:l, pad:rshoulder
race_pause = key:escape, pad:start
