# jetski controls (cartwheel/input.h binding text). The shell defines the menu actions.
steer_left = key:left, key:a, pad:left, axis:lx-
steer_right = key:right, key:d, pad:right, axis:lx+
lean_back = key:down, key:s, pad:down, axis:ly+
lean_fwd = key:up, key:w, pad:up, axis:ly-
throttle = key:space, key:j, pad:south, axis:rt+
trick = key:k, pad:west, pad:rshoulder
race_pause = key:escape, pad:start
