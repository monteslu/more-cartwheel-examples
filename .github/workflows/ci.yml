name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a push to main never wipes out the run before it

env:
  GAMES: arenafps brawler coopplatformer crawler fighter hordeshooter jetski partypack pirates skyfighter tuxracer
  # games with a self-playing <game>_auto cart (the others smoke-test their own cart)
  AUTO_GAMES: arenafps brawler coopplatformer crawler fighter hordeshooter jetski partypack pirates
  # games whose text passes the engine's prompt check (tools/check-prompts.mjs)
  PROMPT_GAMES: arenafps brawler coopplatformer crawler fighter hordeshooter jetski partypack pirates skyfighter tuxracer

# The games ship as dual GL + WebGPU carts (.wasc), built against the prebuilt
# cart SDK pinned in scripts/deps.lock (cartwheel-engine's release asset):
# only the games compile.
jobs:
  carts:
    name: Carts
    # a v* tag builds its own carts: each cart's manifest carries the version its checkout is (the
    # engine's cw_add_app: the tag on a tag build, <last tag>-dev.g<commit> on any other)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version (commits only: no old trees or files)
          filter: tree:0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Pirates asset portability
        run: python3 tests/pirates-assets.py
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mesa-vulkan-drivers libvulkan1 libgles2 libegl1
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh') }}
      - name: Fetch the SDKs
        run: scripts/fetch-deps.sh
      # controls are shown with the engine's button prompts (cartwheel/prompt.h), never a maker's button names
      - name: Check prompts
        run: for g in $PROMPT_GAMES; do node deps/cartwheel-engine/tools/check-prompts.mjs games/$g || exit 1; done
      # crawler's floors: every one reachable with its keys, nothing in a wall, every prop grounded, its bake present and
      # current, and cleared by the bots in the native soak build; the controls (floors broken on purpose) must each fail
      - name: Check crawler's floors
        run: |
          TARGETS=native scripts/build.sh crawler_soak
          node games/crawler/tools/check-levels.mjs --soak build/native/games/crawler/crawler_soak
      # pushes to main and v* tags link the carts as releases ship (ThinLTO, wasm-opt); pull requests
      # link dev carts, the same simulation
      - name: Build the carts (each game, and its self-playing <game>_auto where it has one)
        run: |
          [ "${GITHUB_EVENT_NAME}" = pull_request ] || export RELEASE=1
          TARGETS=cart-wgpu scripts/build.sh $GAMES $(for g in $AUTO_GAMES; do echo ${g}_auto; done)
      # every release cart carries its launcher art (games/<game>/art, project.cwproj art/description/author)
      - name: Cart art
        run: node tests/cart-art.mjs $GAMES
      # the engine's art check (tools/check-art.mjs): a title, every picture whole and the shape wasmcart's SPEC asks
      - name: Cart art (the engine's check-art)
        run: node deps/cartwheel-engine/tools/check-art.mjs $(for g in $GAMES; do echo build/cart-wgpu/carts/$g.wasc; done)
      # every cart's manifest version is this build's: the tag on a v* tag (a release version), else this
      # checkout's <last tag>-dev.g<commit>; the control (a cart rewritten to another version) must fail
      - name: Cart version
        run: node tests/cart-version.mjs $GAMES
      - name: Smoke test (each game's cart in wasmcart's Node host on lavapipe, WebGPU)
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json node tests/cart-smoke.mjs --frames 60 $GAMES
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cart-smoke
          path: out/cart-smoke/
          retention-days: 7
      - name: Collect carts
        run: |
          mkdir -p carts
          for g in $GAMES; do cp build/cart-wgpu/carts/$g.wasc carts/$g.wasc; done
          ls -l carts
      - uses: actions/upload-artifact@v7
        with:
          name: release-carts
          path: carts/*.wasc
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release
    needs: carts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # a v* tag publishes the carts as a GitHub release
      actions: write # the tagged commit's run on main, rerun when a later push cancelled it
    steps:
      - uses: actions/checkout@v7 # CHANGELOG.md: the release notes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # tag only commits whose push to main has a green CI run (never release an unchecked commit). The tag is
      # usually pushed right after main, while that run is still going: wait for it, a look a minute, up to 3 hours.
      # A run cancelled by a later push (the group keeps one run pending) is run again, twice at most; a failure,
      # a commit that is not on main, or the time running out fails this job.
      - name: The tagged commit is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          case "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status 2>/dev/null)" in
            behind|identical) ;;
            *) echo "$sha is not on main: push it to main and let CI pass before tagging it" >&2; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + 10800 )); reruns=0
          look() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | [.databaseId, .status, (.conclusion // "" | if . == "" then "-" else . end), .url] | join(" ")'
          }
          while :; do
            set -- $(look)
            if [ $# -eq 0 ]; then
              echo "$(date -u +%H:%M:%S) no CI run on main for $sha yet"
            else
              case "$2:$3" in
                completed:success) echo "green: run $1 ($4)"; exit 0 ;;
                completed:cancelled)
                  [ $reruns -lt 2 ] || { echo "the CI run on main for $sha was cancelled again ($4): rerun it, then rerun this one" >&2; exit 1; }
                  reruns=$((reruns + 1)); echo "$(date -u +%H:%M:%S) run $1 was cancelled: rerunning it ($reruns of 2) $4"
                  gh run rerun "$1" -R "$GITHUB_REPOSITORY" || exit 1
                  for i in 1 2 3 4 5 6; do sleep 10; set -- $(look); [ "$2" = completed ] || break; done ;;
                completed:*) echo "the CI run on main for $sha ended $3 ($4): fix main (or rerun that run), then rerun this one" >&2; exit 1 ;;
                *) echo "$(date -u +%H:%M:%S) waiting on run $1 ($2) $4" ;;
              esac
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "no green CI run on main for $sha after 3 hours" >&2; exit 1; }
            sleep 60
          done
      # the carts this tag built, each carrying the tag's version
      - uses: actions/download-artifact@v7
        with:
          name: release-carts
          path: files
      - name: Every cart is the tag's version
        run: node tests/cart-version.mjs --dir files
      - name: Release (v* tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          for g in $GAMES; do [ -f files/$g.wasc ] || { echo "no $g.wasc" >&2; exit 1; }; done
          # the notes are the version's CHANGELOG.md section
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$1 == "##" { if (on) exit; on = ($2 == v) ; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no ## $v section" >&2; exit 1; }
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber files/*.wasc
